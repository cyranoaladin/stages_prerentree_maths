name: documentation-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies (locked)
        run: python3 -m pip install --require-hashes -r requirements.lock

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc qpdf poppler-utils ghostscript imagemagick

      - name: Run test suite
        run: make test

      - name: Full clean build (html, pdf, packs, manifests, qa)
        run: |
          make clean-generated
          make all

      - name: Fail on any generated text file not matching a committed baseline
        run: |
          git status --porcelain
          git diff --exit-code -- content/catalog.json reports/BUILD_QA_COUNTERS.md reports/QA_STATUS.json 'dist/site-public' 'dist/site-private' 'dist/reports'
          python3 -c '
          import csv, subprocess, pathlib
          def check_manifest(fpath):
              res = subprocess.run(["git", "show", f"HEAD:{fpath}"], capture_output=True, text=True, check=True)
              committed = [(r[0], r[2]) for r in csv.reader(res.stdout.splitlines()) if r]
              current = [(r[0], r[2]) for r in csv.reader(pathlib.Path(fpath).read_text(encoding="utf-8").splitlines()) if r]
              if committed != current:
                  raise SystemExit(f"Manifest structure mismatch in {fpath}!")
              print(f"Manifest {fpath} structure matches baseline ({len(current)} rows).")
          check_manifest("MANIFEST_PUBLIC.csv")
          check_manifest("MANIFEST_PRIVATE.csv")
          '

      - name: Structural QA check on all generated PDFs
        run: |
          python3 -c '
          import pathlib, subprocess
          pdfs = list(pathlib.Path("dist/pdf").rglob("*.pdf"))
          print(f"Vérification de {len(pdfs)} fichiers PDF avec qpdf...")
          errors = 0
          for pdf in pdfs:
              res = subprocess.run(["qpdf", "--check", str(pdf)], capture_output=True)
              if res.returncode != 0:
                  print(f"Erreur qpdf sur {pdf}: {res.stderr.decode()}")
                  errors += 1
          if errors > 0:
              raise SystemExit(f"{errors} erreurs structurelles PDF détectées !")
          print(f"Succès : les {len(pdfs)} PDF sont 100% valides structurellement.")
          '

      - name: Terminale modules must derive from their committed sources
        run: |
          python3 tools/build_terminale.py --check
          git diff --exit-code -- tle_spe tle_nsi tle_pc content/students_terminale.json \
            content/diagnostics_terminale.json content/items_terminale.json

      # La composition LaTeX n'est pas rejouée ici : elle demanderait toute une
      # distribution TeX. C'est la source qui est vérifiée — plus aucun caractère que la
      # police ne saurait dessiner, et aucune formule ouverte.
      - name: Terminale documents must be written in LaTeX notation
        run: python3 tools/mathify_terminale.py --check

      - name: Secret scan and public/private confidentiality gates
        run: python3 tools/ci_gates.py

      # Ces quatre contrôles ne demandent ni distribution TeX ni pandoc : ils lisent les
      # sources. Ils vérifient ce qu'un test unitaire ne voit pas — l'exactitude des
      # résultats annoncés dans les corrigés, la validité du code Python donné aux élèves,
      # la place curriculaire de chaque notion, et l'écart réel entre deux cahiers d'élèves
      # aux bilans différents.
      - name: Terminale corpus quality gates
        run: |
          python3 tools/qa_science.py
          python3 tools/qa_code.py
          python3 tools/qa_curriculum.py
          python3 tools/qa_personnalisation.py

      - name: Automated QA counters must show zero failures
        run: |
          python3 - <<'PY'
          import json, sys
          status = json.load(open("reports/QA_STATUS.json", encoding="utf-8"))
          print(json.dumps(status, indent=2, ensure_ascii=False))
          if status["automatedStatus"] != "validated":
              print("QA automatisée en échec :", status["counters"])
              sys.exit(1)
          PY

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: |
            reports/
            MANIFEST_PUBLIC.csv
            MANIFEST_PRIVATE.csv
          if-no-files-found: warn
