[pytest]
# Configuration propre à l'application de correction. La suite racine l'exclut
# (voir ../pytest.ini) : les deux ne se mélangent pas, et leurs comptes ne s'additionnent
# jamais dans un rapport.
addopts = --import-mode=importlib
testpaths = tests
markers =
    slow: test long — échelle 60 pages. Inclus dans « make s5-full-gate » ; on ne le
        désélectionne que pour une boucle de développement rapide.
