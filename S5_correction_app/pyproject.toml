[project]
name = "nexus-s5-correction"
version = "1.0.0"
description = "Nexus S5 — Correction & Bilans : correction critère par critère des évaluations S5 distribuées, analyse déterministe et génération des bilans."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "pydantic>=2.5",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
]

[project.optional-dependencies]
test = ["pytest>=7.4", "httpx>=0.27", "jsonschema>=4.20"]

[project.scripts]
nexus-s5-correction = "app.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
