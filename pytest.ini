[pytest]
# Configuration de la suite de tests du dépôt, exécutée par « make test » et par la CI.
#
# --import-mode=importlib : plusieurs sous-projets contiennent des fichiers de test
# portant le même nom de base. Sans ce mode, pytest importe le premier et refuse le
# second avec « import file mismatch ». Ce mode donne à chaque fichier un module
# distinct, sans exiger de renommage ni de __init__.py.
addopts = --import-mode=importlib

# Ce qui n'est pas collecté, et pourquoi :
#   S5_audit/          copie générée par tools/make_release.py ; ses fichiers de test
#                      sont identiques, octet pour octet, à ceux de S5_cloture/, qui est
#                      la source et qui, elle, est bien exécutée.
#   S5_release/        même origine ; ne contient aucun test.
#   S5_correction_app/ application autonome, avec ses propres dépendances
#                      (requirements-correction.lock) et sa propre cible
#                      « make s5-correction-test ». Ses dépendances ne figurent pas
#                      dans requirements.lock et n'ont pas à y figurer.
#   dist/, tmp/, _archive/  artefacts de construction.
norecursedirs =
    S5_audit
    S5_release
    S5_correction_app
    dist
    tmp
    _archive
    .git
    .venv
    node_modules
    __pycache__
    *.egg-info
